{{define "content"}}
{{if .Error}}<p class="warn" role="alert">{{.Error}}</p>
{{end -}}
<section class="fix">
<h2>Add leave</h2>
<form method="post" action="/leave">
<label>Employee <select name="emp">{{range .Employees}}<option value="{{.ID}}">{{.ID}} {{.Name}}</option>{{end}}</select></label>
<label>From <input type="date" name="from" required></label>
<label>To <input type="date" name="to" required></label>
<button type="submit">Add</button>
</form>
</section>
<h2>Leave</h2>
{{if .Leaves}}<table class="data">
<thead><tr><th>Employee</th><th>From</th><th>To</th><th></th></tr></thead>
<tbody>
{{range .Leaves}}<tr><td>{{.EmployeeID}} {{.Name}}</td><td>{{.From}}</td><td>{{.To}}</td>
<td><form method="post" action="/leave/{{.ID}}/delete"><button type="submit">Delete</button></form></td></tr>
{{end}}</tbody>
</table>
{{else}}<p>No leave booked.</p>
{{end}}
<p class="note">Showing leave from 90 days ago to a year ahead.</p>
{{end}}
