<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · HHG Attendance</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main class="login">
<p class="brand"><span class="logo" aria-hidden="true">H</span>HHG Attendance</p>
<section class="card">
<div class="card-body">
<h1>Sign in</h1>
{{if .Error}}<p class="warn" role="alert">{{.Error}}</p>{{end}}
<form class="fields" method="post" action="/login">
<label>Username <input name="username" type="text" autocapitalize="off" autocomplete="username" required autofocus></label>
<label>Password <input name="password" type="password" autocomplete="current-password" required></label>
<button type="submit" class="primary">Sign in</button>
</form>
</div>
</section>
</main>
</body>
</html>
